# Bundle layer of pve-vm-recorder.
#
# One plugin entry. `id` is the settings namespace (the settings card writes its
# overrides to the profile patch layer by this id), `name` is the package name.
#
# The config below is the reference deployment this plugin was built against: one
# lab node and one Windows VM. It is not a default you should inherit blindly —
# `allowedVmids` is what makes the tools able to touch a VM at all, and
# `allowGuestExec: true` exposes arbitrary PowerShell as SYSTEM inside the guest.
# Set `allowGuestExec: false` to make pve_guest_exec disappear; the schema default
# for every field is the safe one (no nodes, no VM ids, guest exec off), so a bare
# insert with no config does nothing at all.
- insert:
    - id: pve-vm-recorder
      name: pve-vm-recorder
      config:
        nodes:
          - 192.168.90.104
        sshUser: root
        allowedVmids:
          - 15047
        defaultVmid: 15047
        tmpfsDir: /dev/shm/pve-rec
        allowGuestExec: true
